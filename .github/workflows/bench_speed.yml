name: Bench Datagen Speed (Old vs New)

on:
  workflow_dispatch:

jobs:
  bench-speed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download NNUE and UHO book
        run: |
          curl -fL --retry 5 --retry-delay 3 -o Stockfish-latest/src/nn-bddd9d57eb87.nnue https://tests.stockfishchess.org/api/nn/nn-bddd9d57eb87.nnue
          cp Stockfish-latest/src/nn-bddd9d57eb87.nnue ./nn-bddd9d57eb87.nnue
          curl -fL --retry 5 --retry-delay 3 -o uho.epd.zip https://github.com/official-stockfish/books/raw/master/UHO_Lichess_4852_v1.epd.zip
          unzip -p uho.epd.zip > uho.epd
          rm -f uho.epd.zip

      - name: Build old (441e9ab) and new (e593716)
        run: |
          git checkout 441e9ab
          make -C Stockfish-latest/src -j$(nproc) clean
          make -C Stockfish-latest/src -j$(nproc) profile-build ARCH=native EXTRACXXFLAGS="-mtune=native"
          cp Stockfish-latest/src/stockfish ./sf_old

          git checkout e593716
          make -C Stockfish-latest/src -j$(nproc) clean
          make -C Stockfish-latest/src -j$(nproc) profile-build ARCH=native EXTRACXXFLAGS="-mtune=native"
          cp Stockfish-latest/src/stockfish ./sf_new

      - name: Benchmark 1 game (1 thread) and 16 games (4 threads)
        run: |
          mkdir -p out_old_1 out_new_1 out_old_16 out_new_16
          echo "=== 1 GAME (1 THREAD) - OLD 441e9ab ==="
          ./sf_old harenn_datagen --output ./out_old_1 --games 1 --concurrency 1 --hash 64 --nodes 8192 --hard-nodes --multipv 2 --book ./uho.epd --book-random-plies 2 --branch-plies 12 --branch-cp 40
          echo "=== 1 GAME (1 THREAD) - NEW e593716 ==="
          ./sf_new harenn_datagen --output ./out_new_1 --games 1 --concurrency 1 --hash 64 --nodes 8192 --hard-nodes --multipv 2 --book ./uho.epd --book-random-plies 2 --branch-plies 12 --branch-cp 40
          echo "=== 16 GAMES (4 THREADS) - OLD 441e9ab ==="
          ./sf_old harenn_datagen --output ./out_old_16 --games 16 --concurrency 4 --hash 64 --nodes 8192 --hard-nodes --multipv 2 --book ./uho.epd --book-random-plies 2 --branch-plies 12 --branch-cp 40
          echo "=== 16 GAMES (4 THREADS) - NEW e593716 ==="
          ./sf_new harenn_datagen --output ./out_new_16 --games 16 --concurrency 4 --hash 64 --nodes 8192 --hard-nodes --multipv 2 --book ./uho.epd --book-random-plies 2 --branch-plies 12 --branch-cp 40
