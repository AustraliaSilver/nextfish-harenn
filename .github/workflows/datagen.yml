name: HARENN Continuous Data Generation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: datagen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    strategy:
      matrix:
        worker_id: [1, 2, 3, 4, 5]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Setup Python & environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-chess numpy "huggingface_hub[cli]"

      - name: Download Stockfish 18
        run: |
          curl -L -o stockfish.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar
          tar -xvf stockfish.tar
          mv stockfish/stockfish-ubuntu-x86-64-avx2 ./harenn_engine
          chmod +x harenn_engine
          chmod +x parallel_generate.py

      - name: Generate Data (time-budgeted)
        run: |
          mkdir -p data
          python3 parallel_generate.py --engine ./harenn_engine --output ./data --games 100 --concurrency 2 --time-budget 16200 --worker-id ${{ matrix.worker_id }}
          echo "=== files in data/ ==="
          ls data/ | head -5
          echo "total files: $(ls data/ | wc -l)"

      - name: Upload Data to Hugging Face Bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, glob, sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              print("::error::HF_TOKEN secret is not set in Repository Secrets!")
              sys.exit(1)

          files = glob.glob("data/*.json") + glob.glob("data/*.jsonl")
          print(f"Total files generated by Worker: {len(files)}")
          if not files:
              print("No new data files generated to upload.")
              sys.exit(0)

          api = HfApi(token=token)
          bucket_dest = "hf://buckets/australia1/myrandombucket"
          print(f"Syncing ./data to {bucket_dest}...")
          api.sync_bucket(source="./data", dest=bucket_dest)
          print("Successfully uploaded data to Hugging Face Bucket!")
          EOF
