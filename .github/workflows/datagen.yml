name: HARENN Continuous Data Generation

on:
  push:
    branches:
      - data
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: datagen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    strategy:
      matrix:
        worker_id: [1, 2, 3, 4, 5]
      fail-fast: false
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install --break-system-packages python-chess numpy

      - name: Download Stockfish 18
        run: |
          curl -L -o stockfish.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar
          tar -xvf stockfish.tar
          mv stockfish/stockfish-ubuntu-x86-64-avx2 ./harenn_engine
          chmod +x harenn_engine
          chmod +x parallel_generate.py

      - name: Generate Data (time-budgeted)
        run: |
          mkdir -p data
          python3 parallel_generate.py --engine ./harenn_engine --output ./data --games 100 --concurrency 2 --time-budget 16200
          echo "=== files in data/ ==="
          ls data/ | head -5
          echo "total files: $(ls data/ | wc -l)"

      - name: Commit and Push Data
        run: |
          set -euo pipefail
          git config --global user.name "HARENN Data Bot ${{ matrix.worker_id }}"
          git config --global user.email "harenn-bot-${{ matrix.worker_id }}@users.noreply.github.com"
          git config advice.addIgnoredFile false

          # Keep engine artifacts out of git
          printf 'harenn_engine\nstockfish.tar\nstockfish/\n' >> .gitignore

          echo "=== before add ==="
          ls data/ | wc -l

          pushed=false
          for i in $(seq 1 20); do
            # Use find to stage all files, not glob (glob may not match)
            find data/ -type f -name '*.json' -exec git add -f {} \;
            find data/ -type f -name '*.jsonl' -exec git add -f {} \;
            if git diff --cached --quiet; then
              echo "No changes to commit (attempt $i)"
              break
            fi
            timestamp=$(date +%Y%m%d_%H%M%S)
            git commit -m "Add HARENN training data (Worker ${{ matrix.worker_id }}) $timestamp"
            if git pull --rebase --autostash origin data; then
              if git push origin data; then
                echo "Push successful!"
                pushed=true
                break
              fi
            fi
            echo "Conflict or race condition detected, retrying in 30s... (Attempt $i)"
            sleep 30
          done

          if [ "$pushed" != "true" ]; then
            echo "::warning::Push was not successful"
          fi
