name: Bench Concurrency & Hard vs Soft Nodes

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: data

      - name: CPU Info & Build ARM64
        run: |
          lscpu | grep -E "Model name|CPU\(s\)|Thread|Core|Socket|Flags" || nproc
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o Stockfish-latest/src/nn-bddd9d57eb87.nnue https://tests.stockfishchess.org/api/nn/nn-bddd9d57eb87.nnue
          make -C Stockfish-latest/src -j$(nproc) build ARCH=native
          mv Stockfish-latest/src/stockfish ./harenn_engine
          chmod +x harenn_engine
          ./harenn_engine bench 64 1 10 2>&1 | tail -n 8

      - name: Benchmark ARM64 Hard Nodes at Concurrency 2 and 4 (20s each)
        run: |
          for C in 2 4; do
            echo "=== ARM64 hard-nodes | CONCURRENCY=$C ==="
            ./harenn_engine harenn_datagen --output ./tmp_arm_c${C} --games 0 --concurrency $C --hash 64 --time-budget 20 --nodes 8192 --hard-nodes
          done
