name: HARENN Datagen Worker (2-Roll x86 + ARM Fallback)

on:
  workflow_call:
    inputs:
      worker_id:
        required: true
        type: number
      run_id:
        required: true
        type: string

jobs:
  roll1:
    runs-on: ubuntu-latest
    outputs:
      reroll: ${{ steps.chk.outputs.reroll }}
    steps:
      - name: Check CPU (Roll 1)
        id: chk
        run: |
          echo "=== WORKER ${{ inputs.worker_id }} | ROLL 1 (ubuntu-latest) ==="
          lscpu | grep -E "Model name|CPU\(s\)|Thread|Core|Socket" || nproc
          if grep -q avx512_vnni /proc/cpuinfo && lscpu | grep -qiE "EPYC 9|6975P|Xeon.*6[0-9]{3}"; then
            echo "reroll=false" >> $GITHUB_OUTPUT
            echo "FAST CPU -> running on Roll 1"
          else
            echo "reroll=true" >> $GITHUB_OUTPUT
            echo "SLOW CPU -> triggering Roll 2"
          fi

      - name: Checkout code
        if: steps.chk.outputs.reroll == 'false'
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Setup Python & environment
        if: steps.chk.outputs.reroll == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.chk.outputs.reroll == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -q python-chess huggingface_hub kaggle six

      - name: Manage 3 Kaggle Workers (Worker 1 only)
        if: inputs.worker_id == 1 && steps.chk.outputs.reroll == 'false'
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 manage_kaggle_runs.py

      - name: Build Stockfish C++ HARENN Datagen (PGO + mtune=native) + Download NNUE
        if: steps.chk.outputs.reroll == 'false'
        run: |
          sleep $(( (${{ inputs.worker_id }} % 10) * 2 ))
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o Stockfish-latest/src/nn-bddd9d57eb87.nnue https://tests.stockfishchess.org/api/nn/nn-bddd9d57eb87.nnue
          cp Stockfish-latest/src/nn-bddd9d57eb87.nnue ./nn-bddd9d57eb87.nnue
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o uho.epd.zip https://github.com/official-stockfish/books/raw/master/UHO_Lichess_4852_v1.epd.zip
          unzip -p uho.epd.zip > uho.epd
          rm -f uho.epd.zip
          make -C Stockfish-latest/src -j$(nproc) profile-build ARCH=native EXTRACXXFLAGS="-mtune=native"
          mv Stockfish-latest/src/stockfish ./harenn_engine
          chmod +x ./harenn_engine

      - name: Generate Data (time-budgeted C++ native)
        if: steps.chk.outputs.reroll == 'false'
        run: |
          mkdir -p data
          ./harenn_engine harenn_datagen --output ./data --games 0 --concurrency $(nproc) --hash 64 --time-budget 16200 --worker-id ${{ inputs.worker_id }} --nodes 8192 --hard-nodes --multipv 2 --book ./uho.epd --book-random-plies 2 --branch-plies 12 --branch-cp 40
          echo "=== files in data/ ==="
          ls data/ | head -5
          echo "total files: $(ls data/ | wc -l)"

      - name: Pack and Upload Data to Hugging Face Bucket
        if: always() && steps.chk.outputs.reroll == 'false'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, glob, sys, json, time
          from datetime import datetime
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              print("::error::HF_TOKEN secret is not set in Repository Secrets!")
              sys.exit(1)

          files = glob.glob("data/*.json") + glob.glob("data/*.jsonl")
          print(f"Total raw files generated by Worker: {len(files)}")
          if not files:
              print("No new data files generated to upload.")
              sys.exit(0)

          ts = datetime.utcnow().strftime("%Y%m%d_%H%M%S")
          worker_id = "${{ inputs.worker_id }}"
          run_id = "${{ inputs.run_id }}"
          packed_filename = f"hnn_w{worker_id}_{run_id}_{ts}.jsonl"
          packed_path = os.path.join("data", packed_filename)

          total_positions = 0
          print(f"Packing all positions into single file: {packed_filename}...")
          with open(packed_path, "w", encoding="utf-8") as out_f:
              for f in files:
                  if f == packed_path:
                      continue
                  if f.endswith(".json"):
                      try:
                          with open(f, "r", encoding="utf-8") as in_f:
                              data = json.load(in_f)
                              for p in data.get("positions", []):
                                  out_f.write(json.dumps(p) + "\n")
                                  total_positions += 1
                      except Exception as e:
                          print(f"Warning: skipped corrupted file {f}: {e}")
                  elif f.endswith(".jsonl"):
                      try:
                          with open(f, "r", encoding="utf-8") as in_f:
                              for line in in_f:
                                  line = line.strip()
                                  if line:
                                      out_f.write(line + "\n")
                                      total_positions += 1
                      except Exception as e:
                          print(f"Warning: skipped corrupted file {f}: {e}")

          size_mb = os.path.getsize(packed_path) / (1024 * 1024)
          print(f"Successfully packed {total_positions:,} positions into {packed_filename} ({size_mb:.2f} MB)")

          api = HfApi(token=token)
          bucket_id = "australia1/myrandombucket"
          print(f"Uploading {packed_filename} to bucket '{bucket_id}'...")
          t0 = time.time()
          api.batch_bucket_files(bucket_id, add=[(packed_path, packed_filename)])
          dt = time.time() - t0
          print(f"Upload completed in {dt:.2f} seconds!")
          EOF

