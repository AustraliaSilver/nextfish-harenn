name: HARENN Smoke Test (Full E2E Pipeline)

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Setup Python & dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q huggingface_hub kaggle numpy six

      - name: Download NNUE and UHO book
        run: |
          curl -fL --retry 5 --retry-delay 3 -o Stockfish-latest/src/nn-bddd9d57eb87.nnue https://tests.stockfishchess.org/api/nn/nn-bddd9d57eb87.nnue
          cp Stockfish-latest/src/nn-bddd9d57eb87.nnue ./nn-bddd9d57eb87.nnue
          curl -fL --retry 5 --retry-delay 3 -o uho.epd.zip https://github.com/official-stockfish/books/raw/master/UHO_Lichess_4852_v1.epd.zip
          unzip -p uho.epd.zip > uho.epd
          rm -f uho.epd.zip

      - name: Build Stockfish (profile-build ARCH=native)
        run: |
          make -C Stockfish-latest/src -j$(nproc) profile-build ARCH=native EXTRACXXFLAGS="-mtune=native"
          cp Stockfish-latest/src/stockfish ./harenn_engine

      - name: Run 20s datagen + worker upload (HF Bucket JSONL + HF Dataset NPZ) + Kaggle manifest check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ./data
          ./harenn_engine harenn_datagen --output ./data --games 0 --concurrency $(nproc) --hash 64 --time-budget 20 --worker-id 99 --nodes 8192 --hard-nodes --multipv 2 --book ./uho.epd --book-random-plies 2 --branch-plies 12 --branch-cp 40
          python3 github_worker_upload.py --worker-id 99 --run-id smoke_${{ github.run_id }}
          python3 github_publish_shift_to_kaggle.py --run-id smoke_${{ github.run_id }} --dry-run --cleanup-hf-test
